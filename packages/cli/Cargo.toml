[package]
name = "pentavault-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Security-first command line interface for PentaVault."
license = "UNLICENSED"
publish = false

[[bin]]
name = "pv"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
dialoguer = { version = "0.12", default-features = false }
directories = "6.0.0"
keyring = "3.6.3"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# SHA-256 and HMAC for AWS SigV4. Already compiled in beneath rustls, so
# declaring it adds no new code to the dependency tree.
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.0.7"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3.27.0"

[profile.release]
panic = "abort"
strip = "symbols"
