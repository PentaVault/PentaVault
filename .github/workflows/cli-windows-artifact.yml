name: CLI Windows Artifact

on:
  workflow_dispatch:
  push:
    tags:
      - "cli-v*"

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows CLI
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test CLI
        run: pnpm run cli:test

      - name: Lint CLI
        run: pnpm run cli:lint

      - name: Build release binary
        run: cargo build --release --locked --manifest-path packages/cli/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Package artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (cargo metadata --no-deps --manifest-path packages/cli/Cargo.toml --format-version 1 | ConvertFrom-Json).packages[0].version
          $root = "dist/pv-$version-windows-x64"
          New-Item -ItemType Directory -Force "$root/completions" | Out-Null
          Copy-Item "packages/cli/target/x86_64-pc-windows-msvc/release/pv.exe" "$root/pv.exe"
          Copy-Item "packages/cli/README.md" "$root/README.md"
          Copy-Item "LICENSE" "$root/LICENSE"
          & "$root/pv.exe" completion power-shell | Out-File -Encoding utf8 "$root/completions/pv.ps1"
          & "$root/pv.exe" completion bash | Out-File -Encoding utf8 "$root/completions/pv.bash"
          & "$root/pv.exe" completion zsh | Out-File -Encoding utf8 "$root/completions/_pv"
          & "$root/pv.exe" completion fish | Out-File -Encoding utf8 "$root/completions/pv.fish"
          Compress-Archive -Path "$root/*" -DestinationPath "dist/pv-$version-windows-x64.zip" -Force
          Get-FileHash "dist/pv-$version-windows-x64.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  pv-$version-windows-x64.zip" } |
            Out-File -Encoding ascii "dist/pv-$version-windows-x64.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pv-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
