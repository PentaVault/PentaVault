name: Secret scan

# A secrets-management product leaking a credential through its own repository
# is an existential failure, so this gate runs on every push and PR rather than
# on a schedule.

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Scan history for committed secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history: a secret removed in a later commit is still exposed in
          # the objects an attacker can clone.
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"

  env-hygiene:
    name: Reject committed env files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Assert no tracked .env files
        shell: bash
        run: |
          set -euo pipefail
          # `.env.example` and `.env.*.example` are templates and are allowed;
          # anything else matching .env* must never be tracked.
          tracked="$(git ls-files | grep -E '(^|/)\.env' | grep -v -E '\.example$' || true)"
          if [[ -n "$tracked" ]]; then
            echo "::error::Tracked environment files detected:"
            echo "$tracked"
            exit 1
          fi
          echo "No tracked environment files."

      - name: Assert reference material is not committed
        shell: bash
        run: |
          set -euo pipefail
          # reference-app/ is a third-party checkout kept locally for research.
          # Committing it would vendor another project's licensed source.
          if git ls-files --error-unmatch reference-app >/dev/null 2>&1; then
            echo "::error::reference-app/ must not be committed."
            exit 1
          fi
          echo "reference-app/ is not tracked."
